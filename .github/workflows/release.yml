# Release — publish 4 crates to crates.io
#
# 发版流程（打 tag 前必读）：
#   1. 本地 T0：cargo test --workspace 全绿
#   2. 本地 T1：SKIP_MYSQL=0 cargo test --workspace --features mysql-smoke（160 冒烟）
#   3. bump [workspace.package] version（Cargo.toml）
#   4. git commit -m "release: vX.Y.Z"
#   5. git tag vX.Y.Z && git push origin master --tags
#   6. CI 自动按 core → repository-sqlx → persist → facade 拓扑序发布
#
# 注意：cargo publish 默认会跑打包校验（编译 + 测试），
#       通过 JEFFLOW_FLOWS_DIR + SKIP_MYSQL=1 让校验在无 MySQL 环境通过。
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      # engine.rs:908 flows_dir() 默认是 Windows 本机绝对路径，CI 必须覆盖
      JEFFLOW_FLOWS_DIR: ${{ github.workspace }}/jeeflow-java/jeeflow-core/src/test/resources/flows
      # 跳过 sqlx 仓 5 个 T1 MySQL 冒烟测试（CI 无 MySQL 环境，不连 160）
      SKIP_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4

      # 共享 flows：cargo publish 打包校验会编译并跑 jeeflow-core 测试，
      # 测试用 load_flow() 读共享流程 JSON
      - name: Checkout jeeflow-java（共享 flows，供打包校验测试用）
        uses: actions/checkout@v4
        with:
          repository: mldong/jeeflow-java
          path: jeeflow-java

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          failed=""
          for c in jeeflow-core jeeflow-repository-sqlx jeeflow-persist jeeflow-facade; do
            echo "=== cargo publish $c ==="
            ok=0
            for i in 1 2 3; do
              if cargo publish -p "$c"; then
                echo "✅ $c published"
                ok=1
                break
              fi
              echo "重试 $i（等 registry 可解析）"
              sleep 30
            done
            if [ "$ok" -ne 1 ]; then
              echo "❌ $c publish 失败，停止（后续 crate 依赖它，必然连带失败）"
              failed="$failed $c"
              break
            fi
            sleep 15  # 让刚发的 crate 可被下一个 crate 的校验构建解析
          done
          if [ -n "$failed" ]; then
            echo "## ❌ publish 未完成: $failed"
            echo "修复后无需重打 tag：gh workflow run release.yml -f tag=<本次tag>"
            exit 1
          fi
          echo "✅ 4 crates published"

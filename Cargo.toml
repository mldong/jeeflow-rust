[workspace]
resolver = "2"
members = [
    "jeeflow-core",
    "jeeflow-repository-sqlx",
    "jeeflow-persist",
    "jeeflow-facade",
    "jeeflow-demo-salvo",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
salvo = { version = "0.76", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
